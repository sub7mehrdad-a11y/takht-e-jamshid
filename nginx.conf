server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

  # نسخه‌یِ جدید باید فوراً به بازیکن‌ها برسد: صفحه و اسکریپت‌ها هر بار با ETag بررسی می‌شن
  location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
  location ~* \.(html|js)$ { add_header Cache-Control "no-cache"; }

  # تصویر/فونت/آیکون: یک روز کش (فایل‌ها نامِ نسخه‌دار ندارن)
  location /assets/ { add_header Cache-Control "public, max-age=86400"; }

  location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }
}
