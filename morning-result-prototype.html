<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تخت جمشید — نتیجه‌ی صبح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0e0e17; --night-2:#171724; --night-3:#1f1f30;
    --gold:#c9972f; --gold-soft:#e3b85a;
    --crimson:#8a2436; --crimson-soft:#b5495c;
    --parchment:#ece2cd; --parchment-dim:#a8a08f;
    --line:rgba(236,226,205,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,151,47,0.12), transparent 60%),
      var(--night);
    color:var(--parchment); font-family:'Vazirmatn', sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:30px 16px 60px;
  }

  /* سوییچِ تست — فقط برای پیش‌نمایش، تو نسخه‌ی نهایی وجود نداره */
  .test-switch{
    display:flex; gap:8px; margin-bottom:26px; background:var(--night-2); border:1px solid var(--line);
    border-radius:999px; padding:4px;
  }
  .test-switch button{
    padding:8px 16px; border-radius:999px; border:none; background:transparent; color:var(--parchment-dim);
    font-family:'Vazirmatn'; font-size:12px; font-weight:600; cursor:pointer;
  }
  .test-switch button.active{ background:var(--gold); color:#241a05; }

  .wrap{ width:min(400px, 92vw); }

  .sun-icon{ text-align:center; font-size:38px; margin-bottom:8px; }
  .eyebrow{ text-align:center; font-size:11.5px; color:var(--gold-soft); letter-spacing:.12em; text-transform:uppercase; font-weight:700; margin-bottom:6px; }
  h1{ text-align:center; font-size:20px; font-weight:900; margin:0 0 26px; }

  .result-card{
    background:var(--night-2); border:1px solid var(--line); border-radius:16px; padding:26px 22px;
    text-align:center;
  }

  /* ---- حالتِ بازیکنِ عادی ---- */
  .names-line{ font-size:18px; font-weight:700; line-height:2; }
  .names-line .nm{ color:var(--crimson-soft); }
  .no-death{ font-size:15px; color:var(--gold-soft); font-weight:700; }
  .sub-hint{ font-size:11.5px; color:var(--parchment-dim); margin-top:14px; }

  /* ---- حالتِ جاماسپ ---- */
  .jamasp-note{ font-size:12px; color:var(--parchment-dim); margin-bottom:16px; line-height:1.8; }
  .role-chip-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .role-chip{
    padding:8px 16px; border-radius:10px; font-size:13.5px; font-weight:700;
    background:var(--night-3); border:1px solid var(--line);
  }
  .role-chip.jamshidi{ border-color:var(--gold); color:var(--gold-soft); }
  .role-chip.zahhaki{ border-color:var(--crimson-soft); color:var(--crimson-soft); }

  .spark{
    position:fixed; border-radius:50%; background:var(--gold-soft);
    opacity:.5; pointer-events:none; filter: blur(0.5px);
    animation: twinkle 4s ease-in-out infinite; z-index:0;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(0.8) translateY(0); }
    50%{ opacity:.8; transform:scale(1.3) translateY(-6px); }
  }

  const lastNightResult = {
    eliminatedPlayers: [
      { name:'امیر', role_id:'afrasiab', side:'zahhaki' },
      { name:'مهرداد', role_id:'karen', side:'jamshidi' },
    ]
  };

  function renderPlayerView(){
    const card = document.getElementById('resultCard');
    if(lastNightResult.eliminatedPlayers.length === 0){
      card.innerHTML = `<div class="no-death">دیشب هیچ‌کس از بازی خارج نشد.</div>`;
      return;
    }
    const names = lastNightResult.eliminatedPlayers.map(p => `<span class="nm">${p.name}</span>`).join(' و ');
    card.innerHTML = `
      <div class="names-line">دیشب ${names} از بازی خارج شدند.</div>
      <div class="sub-hint">علتِ خروج و نقششون اعلام نمی‌شه.</div>
    `;
  }

  function renderJamaspView(){
    const card = document.getElementById('resultCard');
    if(lastNightResult.eliminatedPlayers.length === 0){
      card.innerHTML = `<div class="no-death">دیشب هیچ نقشی کشته نشد.</div>`;
      return;
    }
    const chips = lastNightResult.eliminatedPlayers
      .map(p => `<div class="role-chip ${p.side}">${roleLabel(p.role_id)}</div>`)
      .join('');
    card.innerHTML = `
      <div class="jamasp-note">نقش‌هایی که دیروز و دیشب کشته شدند (بدون اطلاع از این‌که کدوم بازیکن کدوم نقش بود):</div>
      <div class="role-chip-row">${chips}</div>
    `;
  }

  function roleLabel(id){
    const map = { afrasiab:'افراسیاب', karen:'کارن', sudabeh:'سودابه', rostam:'رستم', armayil:'ارمایل' };
    return map[id] || id;
  }

  function setView(mode){
    document.getElementById('btnPlayer').classList.toggle('active', mode==='player');
    document.getElementById('btnJamasp').classList.toggle('active', mode==='jamasp');
    mode === 'player' ? renderPlayerView() : renderJamaspView();
  }

  renderPlayerView();
</script>
</body>
</html>
